
</html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Essential for mobile device scaling -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Number Game</title>
    <style>
        /* CSS Reset and Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Container designed to scale on mobile and desktop */
        .container {
            background-color: white;
            width: 100%;
            max-width: 500px;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            color: #cf3c13;
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
        }

        #game-status {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 8px;
            font-size: 1.1rem;
            line-height: 1.5;
        }

        /* Logic-based classes for the UI */
        .win { background-color: #e6fffa; color: #234e52; border: 1px solid #81e6d9; }
        .lose { background-color: #fff5f5; color: #c53030; border: 1px solid #feb2b2; }

        .points-text {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            font-size: 1.3rem;
        }

        button {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #1557b0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Secret Number Game!</h1>
        <div id="game-output">
            <p>I have picked a secret number.</p>
            <br>
            <button onclick="runGame()">Start Guessing</button>
        </div>
    </div>

    <script>
        function runGame() {
            // 1. Create secret number variable
            const secretNumber = 17;
            let points = 0;
            let guess;

            // 2. Prompt user and validate input with a loop
            guess = prompt("Enter your favorite number:");

            // Keep prompting if input is null (Cancel), empty, or Not a Number
            while (guess === null || guess.trim() === "" || isNaN(guess)) {
                guess = prompt("Invalid input. Please enter a number to play:");
            }

            // Convert valid string to a Number
            guess = Number(guess);
            const outputDiv = document.getElementById('game-output');

            // 3. Comparison logic (if...else)
            if (guess === secretNumber) {
                points = 10;
                outputDiv.innerHTML = `
                    <div id="game-status" class="win">
                        <strong>🎉 Congratulations!</strong><br>
                        ${guess} was the secret number!
                        <span class="points-text">Points Earned: ${points}</span>
                    </div>
                    <br><button onclick="location.reload()">Play Again</button>
                `;
            } else {
                outputDiv.innerHTML = `
                    <div id="game-status" class="lose">
                        <strong>😔 Better luck next time!</strong><br>
                        ${guess} is not the secret number.
                        <span class="points-text">Points Earned: ${points}</span>
                    </div>
                    <br><button onclick="location.reload()">Try Again</button>
                `;
            }
        }
    </script>
</body>
</html>
